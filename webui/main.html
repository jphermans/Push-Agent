<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Pushover Setup</title>
  <script type="module">
    import { store } from "/plugins/push_zero/webui/setup-store.js?v=1.1.22";
  </script>
  <style>
    /*
     * Pushover Setup page styling.
     *
     * The Agent Zero host toggles light / dark by swapping the
     * `body.dark-mode` <-> `body.light-mode` class (see
     * /a0/webui/index.html). Its `:root` exposes neutral pointer
     * variables (`--color-background`, `--color-text`, ...)
     * that the host repoints to the corresponding
     * `--color-*-dark` / `--color-*-light` palette for the active
     * theme. We consume those neutral pointers directly so the
     * plugin page follows the host theme without flicker.
     *
     * We avoid `light-dark()` here because that would respond to
     * the browser's `prefers-color-scheme`, not to the host's
     * in-page theme toggle.
     */

    /* Hide the host framework's plugin-settings modal footer when our plugin page is active.
       The host's footer (Reset to default / Save / Cancel) calls a different code path
       than our own save handler, so the user must click the green "Save Configuration"
       button inside the page. Hiding the host footer removes the misleading duplicate. */
    body.push-zero-modal-active [data-modal-footer] { display: none !important; }
    .po-page {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px 80px 16px;
      color: var(--color-text);
      background: var(--color-background);
      font-family: var(--font-family-main);
    }
    .po-page h1 {
      font-size: 1.6rem;
      font-weight: 600;
      margin: 0 0 4px 0;
      color: var(--color-text);
    }
    .po-page h2 {
      font-size: 1.05rem;
      margin: 28px 0 12px 0;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--color-text-muted);
    }
    .po-page .po-subtitle {
      color: var(--color-text-muted);
      margin-bottom: 24px;
    }
    .po-status-card {
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 16px 18px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      background: var(--color-panel);
      color: var(--color-text);
    }
    .po-status-card.connected { border-color: #2e7d32; }
    body.light-mode .po-status-card.connected { border-color: #2e7d32; }
    .po-status-card.error { border-color: var(--color-accent); }
    .po-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .po-status-pill .po-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .po-status-pill.tone-connected { background: rgba(46, 125, 50, 0.18); color: #4caf50; }
    .po-status-pill.tone-connected .po-dot { background: #4caf50; }
    .po-status-pill.tone-info { background: rgba(33, 150, 243, 0.18); color: var(--color-highlight); }
    .po-status-pill.tone-info .po-dot { background: var(--color-highlight); }
    .po-status-pill.tone-error { background: rgba(244, 67, 54, 0.18); color: var(--color-accent); }
    .po-status-pill.tone-error .po-dot { background: var(--color-accent); }
    .po-status-pill.tone-warn { background: rgba(255, 193, 7, 0.18); color: var(--color-warning-text); }
    .po-status-pill.tone-warn .po-dot { background: var(--color-warning-text); }
    .po-status-detail { flex: 1 1 200px; min-width: 220px; }
    .po-status-detail .po-sub {
      margin-top: 4px;
      font-size: 0.9rem;
      color: var(--color-text-muted);
      word-break: break-word;
    }
    .po-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }
    .po-field { display: flex; flex-direction: column; gap: 6px; }
    .po-field > label {
      font-size: 0.85rem;
      color: var(--color-text-muted);
      font-weight: 500;
    }
    .po-field > input, .po-field > select {
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--color-border);
      background: var(--color-input);
      color: var(--color-text);
      font-size: 0.95rem;
    }
    .po-field > input:focus, .po-field > select:focus {
      outline: none;
      border-color: var(--color-highlight);
      background: var(--color-input-focus);
    }
    .po-actions {
      display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px;
    }
    .po-btn {
      cursor: pointer;
      border: 1px solid var(--color-border);
      background: var(--color-panel);
      color: var(--color-text);
      padding: 9px 14px;
      border-radius: 6px;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .po-btn:hover { background: var(--color-input-focus); }
    .po-btn[disabled] { opacity: 0.55; cursor: not-allowed; }
    .po-btn-primary {
      background: #2e7d32;
      border-color: #2e7d32;
      color: #ffffff;
    }
    .po-btn-primary:hover { background: #1b5e20; }
    .po-btn-danger {
      background: transparent;
      border-color: var(--color-accent);
      color: var(--color-accent);
    }
    .po-btn-danger:hover {
      background: var(--color-background-hover);
    }
    .po-section {
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 18px;
      background: var(--color-panel);
      color: var(--color-text);
    }
    .po-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }
    .po-section-header h3 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
    }
    .po-section-body { margin-top: 12px; }
    .po-help-list {
      margin: 4px 0 0 18px;
      padding: 0;
      color: var(--color-text-muted);
      line-height: 1.6;
    }
    .po-progress {
      font-family: var(--font-family-mono);
      background: var(--color-input);
      color: var(--color-text);
      padding: 6px 10px;
      border-radius: 6px;
      display: inline-block;
    }
    .po-test-results { list-style: none; margin: 8px 0 0 0; padding: 0; }
    .po-test-results li {
      padding: 8px 12px;
      border-radius: 6px;
      background: var(--color-input);
      border: 1px solid var(--color-border);
      color: var(--color-text);
      margin-bottom: 6px;
    }
    .po-test-results li.po-ok { border-left: 4px solid #4caf50; }
    .po-test-results li.po-fail { border-left: 4px solid var(--color-accent); }
    .po-muted { color: var(--color-text-muted); font-size: 0.85rem; }
    .po-field-hint {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      margin-top: 2px;
      flex-wrap: wrap;
    }
    .po-saved-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 500;
      background: rgba(46, 125, 50, 0.18);
      color: #2e7d32;
      border: 1px solid rgba(46, 125, 50, 0.4);
    }
    body.light-mode .po-saved-badge {
      background: rgba(46, 125, 50, 0.14);
      color: #1b5e20;
      border-color: rgba(46, 125, 50, 0.45);
    }
    .po-saved-badge-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #2e7d32;
      color: #ffffff;
      font-size: 0.7rem;
      line-height: 1;
      font-weight: 700;
    }
    body.light-mode .po-saved-badge-icon { background: #1b5e20; }
    .po-saved-badge strong {
      font-family: var(--font-family-mono);
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .po-checkbox {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      color: var(--color-text);
    }
    .po-empty-state {
      border: 1px dashed var(--color-border);
      padding: 32px;
      border-radius: 10px;
      text-align: center;
      margin-bottom: 24px;
      background: var(--color-panel);
      color: var(--color-text);
    }
    .po-empty-state h3 { margin-top: 0; }
    .po-empty-state .po-btn { margin-top: 12px; }
    .po-link { color: var(--color-highlight); text-decoration: underline; }
      /* ----- Mobile breakpoint (<=700px) --------------------------------- */
      @media (max-width: 700px) {
        .po-page { padding: 16px 12px 80px 12px; }
        .po-page h1 { font-size: 1.3rem; }
        .po-page h2 { font-size: 0.95rem; margin: 20px 0 8px 0; }
        .po-status-card {
          flex-direction: column;
          align-items: stretch;
          gap: 12px;
          padding: 14px;
        }
        .po-status-card > .po-status-detail { min-width: 0; flex-basis: auto; }
        .po-status-card .po-actions {
          width: 100% !important;
          flex-direction: column !important;
          align-items: stretch !important;
          flex-shrink: 1 !important;
          gap: 8px;
        }
        .po-status-card .po-actions .po-btn {
          width: 100%;
          justify-content: center;
        }
        .po-grid { grid-template-columns: 1fr; }
        .po-saved-badge { font-size: 0.8rem; padding: 3px 8px; }
        .po-field > input,
        .po-field > select {
          font-size: 16px;            /* iOS: prevent zoom-on-focus */
          width: 100%;
          box-sizing: border-box;
        }
        .po-section { padding: 14px; }
        .po-field-hint { font-size: 0.8rem; }
        /* Footer-style action bars wrap or stack, but never overflow */
        .po-actions[style*="space-between"] {
          flex-direction: column !important;
          align-items: stretch !important;
          gap: 12px;
        }
        .po-actions[style*="space-between"] .po-btn {
          width: 100%;
          justify-content: center;
        }
      }
  </style>
</head>
<body>
  <div x-data x-init="$store.push_zeroSetup && $store.push_zeroSetup.init()"
    x-destroy="$store.push_zeroSetup && $store.push_zeroSetup.cleanup()">
    <template x-if="$store.push_zeroSetup">
      <div class="po-page">
        <h1>Pushover Setup</h1>
        <div class="po-subtitle">
          Connect Agent Zero to
          <a class="po-link" href="https://pushover.net/" target="_blank" rel="noopener">Pushover</a>
          to receive push notifications from agents and automations.
        </div>

        <template x-if="$store.push_zeroSetup.isFirstRun">
          <div class="po-empty-state">
            <h3>First-time setup</h3>
            <p class="po-muted">You need:</p>
            <ul style="text-align:left;max-width:420px;margin:8px auto;">
              <li>A Pushover account</li>
              <li>A Pushover User (or Group) Key</li>
              <li>A Pushover Application / API Token</li>
            </ul>
            <p class="po-muted">
              Pushover credentials are never displayed back to you after they are saved.
            </p>
            <a class="po-btn po-btn-primary" href="https://pushover.net/apps/build" target="_blank" rel="noopener">
              Create Pushover token
            </a>
          </div>
        </template>

        <div class="po-status-card"
          x-bind:class="$store.push_zeroSetup.configured ? 'connected' : ($store.push_zeroSetup.statusTone === 'error' ? 'error' : '')">
          <div class="po-status-detail">
            <span class="po-status-pill"
              x-bind:class="'po-status-pill tone-' + ($store.push_zeroSetup.configured ? 'connected' : ($store.push_zeroSetup.statusTone === 'error' ? 'error' : ($store.push_zeroSetup.statusTone === 'warn' ? 'warn' : 'info')))">
              <span class="po-dot"></span>
              <span x-text="$store.push_zeroSetup.statusLabel()"></span>
            </span>
            <div class="po-sub" x-text="$store.push_zeroSetup.statusMessage"></div>
            <template x-if="$store.push_zeroSetup.configured">
              <div class="po-sub">
                User key: <span x-text="$store.push_zeroSetup.maskedUser"></span>
                &nbsp;&middot;&nbsp;
                Application token: <span x-text="$store.push_zeroSetup.maskedToken"></span>
              </div>
            </template>
          </div>
          <div class="po-actions" style="flex-shrink:0;">
            <button class="po-btn" x-bind:disabled="$store.push_zeroSetup.testing"
              x-on:click="$store.push_zeroSetup.testConnection()">
              <x-icon name="sync"></x-icon>
              <span x-text="$store.push_zeroSetup.testing ? 'Testing...' : 'Test Connection'"></span>
            </button>
            <button class="po-btn po-btn-primary" x-bind:disabled="$store.push_zeroSetup.sending"
              x-on:click="$store.push_zeroSetup.sendTestNotification()">
              <x-icon name="notifications"></x-icon>
              <span x-text="$store.push_zeroSetup.sending ? 'Sending...' : 'Send Test Notification'"></span>
            </button>
          </div>
        </div>

        <template x-if="$store.push_zeroSetup.testResults && $store.push_zeroSetup.testResults.length">
          <div style="margin-bottom:18px;">
            <h2>Connection results</h2>
            <ul class="po-test-results">
              <template x-for="(r, idx) in $store.push_zeroSetup.testResults" x-bind:key="idx">
                <li x-bind:class="r.ok ? 'po-ok' : 'po-fail'">
                  <strong x-text="r.test"></strong>:&nbsp;
                  <span x-text="r.message"></span>
                </li>
              </template>
            </ul>
          </div>
        </template>

        <div class="po-section">
          <div class="po-section-header">
            <h3>Connection</h3>
          </div>
          <div class="po-section-body">
            <div class="po-field">
              <label>Application / API Token</label>
              <input type="text" autocomplete="off"
                x-model="$store.push_zeroSetup.fields.token"
                x-on:focus="$store.push_zeroSetup.handleCredentialFocus('token')"
                x-on:blur="$store.push_zeroSetup.handleCredentialBlur('token')"
                placeholder="Paste your application token" />
              <div class="po-field-hint">
                <template x-if="$store.push_zeroSetup.configured">
                  <span class="po-saved-badge">
                    <span class="po-saved-badge-icon" aria-hidden="true">&#10003;</span>
                    Saved as <strong x-text="$store.push_zeroSetup.maskedToken"></strong>
                    &middot; type a new value to replace
                  </span>
                </template>
                <template x-if="!$store.push_zeroSetup.configured">
                  <span class="po-muted">
                    Get one at
                    <a class="po-link" href="https://pushover.net/apps/build" target="_blank" rel="noopener">pushover.net/apps/build</a>.
                  </span>
                </template>
              </div>
            </div>
            <div class="po-field" style="margin-top:10px;">
              <label>User / Group Key</label>
              <input type="text" autocomplete="off"
                x-model="$store.push_zeroSetup.fields.user"
                x-on:focus="$store.push_zeroSetup.handleCredentialFocus('user')"
                x-on:blur="$store.push_zeroSetup.handleCredentialBlur('user')"
                placeholder="Paste your user or group key" />
              <div class="po-field-hint">
                <template x-if="$store.push_zeroSetup.configured">
                  <span class="po-saved-badge">
                    <span class="po-saved-badge-icon" aria-hidden="true">&#10003;</span>
                    Saved as <strong x-text="$store.push_zeroSetup.maskedUser"></strong>
                    &middot; type a new value to replace
                  </span>
                </template>
                <template x-if="!$store.push_zeroSetup.configured">
                  <span class="po-muted">
                    Find it on the
                    <a class="po-link" href="https://pushover.net/" target="_blank" rel="noopener">Pushover dashboard</a>.
                  </span>
                </template>
              </div>
            </div>
            <div class="po-field" style="margin-top:10px;">
              <label>Device (optional)</label>
              <input type="text" autocomplete="off" x-model="$store.push_zeroSetup.fields.device"
                placeholder="e.g. iphone or ipad (leave blank for all devices)" />
              <div class="po-muted">Configuring a device is optional. Leave blank to send to all devices.</div>
            </div>
          </div>
        </div>

        <div class="po-section">
          <div class="po-section-header">
            <h3>Notification Defaults</h3>
          </div>
          <div class="po-section-body">
            <div class="po-grid">
              <div class="po-field">
                <label>Default title</label>
                <input type="text" x-model="$store.push_zeroSetup.fields.title" />
              </div>
              <div class="po-field">
                <label>Default priority</label>
                <select x-model="$store.push_zeroSetup.fields.priority">
                  <template x-for="opt in $store.push_zeroSetup.priorityOptions" x-bind:key="opt.value">
                    <option x-bind:value="opt.value" x-text="opt.label"></option>
                  </template>
                </select>
              </div>
              <div class="po-field">
                <label>Default sound</label>
                <select x-model="$store.push_zeroSetup.fields.sound">
                  <template x-for="s in $store.push_zeroSetup.sounds" x-bind:key="s.slug">
                    <option x-bind:value="s.slug" x-text="s.label"></option>
                  </template>
                </select>
                <div class="po-muted">"User default" leaves your Pushover sound preference unchanged.</div>
              </div>
              <div class="po-field">
                <label>Default device</label>
                <input type="text" x-model="$store.push_zeroSetup.fields.default_device"
                  placeholder="All devices" />
              </div>
              <div class="po-field">
                <label>Default TTL (seconds)</label>
                <input type="number" min="0" x-model="$store.push_zeroSetup.fields.ttl"
                  placeholder="3600 = one hour" />
                <div class="po-muted">Empty for Pushover default. Maximum 604800 (7 days).</div>
              </div>
              <div class="po-field">
                <label>Default URL</label>
                <input type="text" x-model="$store.push_zeroSetup.fields.url"
                  placeholder="https://example.com" />
              </div>
              <div class="po-field">
                <label>Default URL title</label>
                <input type="text" x-model="$store.push_zeroSetup.fields.url_title"
                  placeholder="Open dashboard" />
              </div>
              <div class="po-field">
                <label>Default tags (comma-separated)</label>
                <input type="text" x-model="$store.push_zeroSetup.fields.tags"
                  placeholder="agent-zero, alerts" />
              </div>
              <div class="po-field">
                <label>Default callback URL</label>
                <input type="text" x-model="$store.push_zeroSetup.fields.default_callback"
                  placeholder="https://example.com/callback" />
              </div>
            </div>
            <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px;">
              <label class="po-checkbox">
                <input type="checkbox" x-model="$store.push_zeroSetup.fields.html"
                  x-on:change="$store.push_zeroSetup.toggleHtml()" />
                <span>Enable HTML formatting</span>
              </label>
              <label class="po-checkbox">
                <input type="checkbox" x-model="$store.push_zeroSetup.fields.monospace"
                  x-on:change="$store.push_zeroSetup.toggleMonospace()" />
                <span>Enable monospace formatting</span>
              </label>
              <div class="po-muted">HTML and monospace cannot both be enabled; enabling one disables the other.</div>
            </div>
          </div>
        </div>

        <div class="po-section">
          <div class="po-section-header">
            <h3>Emergency Notifications</h3>
          </div>
          <div class="po-section-body">
            <p class="po-muted">
              Emergency notifications repeat until acknowledged or until expiration.
              They are only used when a notification is sent with <code>priority=emergency</code>.
            </p>
            <div class="po-grid">
              <div class="po-field">
                <label>Retry interval (seconds)</label>
                <input type="number" min="30" x-model.number="$store.push_zeroSetup.fields.retry" />
                <div class="po-muted">Minimum 30 seconds. Recommended 60.</div>
              </div>
              <div class="po-field">
                <label>Expire after (seconds)</label>
                <input type="number" min="0" x-model.number="$store.push_zeroSetup.fields.expire" />
                <div class="po-muted">0 = never expire. Maximum 10800 (3 hours).</div>
              </div>
              <div class="po-field">
                <label>Acknowledgment callback URL</label>
                <input type="text" x-model="$store.push_zeroSetup.fields.callback"
                  placeholder="https://example.com/ack" />
              </div>
            </div>
          </div>
        </div>

        <div class="po-section" x-data="{ adv: false }" x-effect="adv = $store.push_zeroSetup.fields.debug || $store.push_zeroSetup.fields.timeout != 15">
          <div class="po-section-header" x-on:click="adv = !adv">
            <h3>Advanced Settings</h3>
            <x-icon x-bind:class="adv ? 'po-toggle' : 'po-toggle is-collapsed'" name="expand_more"></x-icon>
          </div>
          <div class="po-section-body" x-show="adv">
            <div class="po-grid">
              <div class="po-field">
                <label>HTTP timeout (seconds)</label>
                <input type="number" min="1" max="60" x-model.number="$store.push_zeroSetup.fields.timeout" />
                <div class="po-muted">Recommended 10 - 15 seconds.</div>
              </div>
            </div>
            <label class="po-checkbox">
              <input type="checkbox" x-model="$store.push_zeroSetup.fields.debug" />
              <span>Enable API debug logging (credentials are always masked)</span>
            </label>
          </div>
        </div>

        <div class="po-section">
          <div class="po-section-header">
            <h3>API Usage</h3>
          </div>
          <div class="po-section-body">
            <template x-if="$store.push_zeroSetup.loadingLimits">
              <div class="po-muted">Loading...</div>
            </template>
            <template x-if="!$store.push_zeroSetup.loadingLimits && $store.push_zeroSetup.limitsMessage">
              <div class="po-muted" x-text="$store.push_zeroSetup.limitsMessage"></div>
            </template>
            <template x-if="!$store.push_zeroSetup.loadingLimits && $store.push_zeroSetup.limits">
              <div>
                <div>Messages used:
                  <strong x-text="$store.push_zeroSetup.limits.used"></strong> /
                  <strong x-text="$store.push_zeroSetup.limits.limit"></strong>
                </div>
                <div class="po-progress" x-text="$store.push_zeroSetup.progressBlocks"></div>
                <div class="po-muted" x-show="$store.push_zeroSetup.limits.remaining != null">
                  Remaining: <span x-text="$store.push_zeroSetup.limits.remaining"></span>
                </div>
                <div class="po-muted" x-show="$store.push_zeroSetup.limits.reset">
                  Reset: <span x-text="$store.push_zeroSetup.limits.reset"></span>
                </div>
              </div>
            </template>
            <template x-if="!$store.push_zeroSetup.loadingLimits && !$store.push_zeroSetup.limits">
              <div class="po-muted">
                Pushover did not return usage information.
                <span x-show="$store.push_zeroSetup.limitsError" x-text="$store.push_zeroSetup.limitsError"></span>
              </div>
            </template>
            <div style="margin-top:10px;">
              <button class="po-btn" x-bind:disabled="$store.push_zeroSetup.loadingLimits"
                x-on:click="$store.push_zeroSetup.refreshLimits()">
                <x-icon name="refresh"></x-icon>
                Refresh usage
              </button>
            </div>
          </div>
        </div>

        <div class="po-actions" style="justify-content:space-between;">
          <div class="po-actions">
            <button class="po-btn po-btn-primary" x-bind:disabled="$store.push_zeroSetup.saving"
              x-on:click="$store.push_zeroSetup.save()">
              <x-icon name="save"></x-icon>
              <span x-text="$store.push_zeroSetup.saving ? 'Saving...' : 'Save Configuration'"></span>
            </button>
            <button class="po-btn" x-bind:disabled="$store.push_zeroSetup.testing"
              x-on:click="$store.push_zeroSetup.testConnection()">
              <x-icon name="sync"></x-icon>
              <span x-text="$store.push_zeroSetup.testing ? 'Testing...' : 'Test Connection'"></span>
            </button>
            <button class="po-btn po-btn-primary" x-bind:disabled="$store.push_zeroSetup.sending"
              x-on:click="$store.push_zeroSetup.sendTestNotification()">
              <x-icon name="notifications"></x-icon>
              <span x-text="$store.push_zeroSetup.sending ? 'Sending...' : 'Send Test Notification'"></span>
            </button>
          </div>
          <button class="po-btn po-btn-danger" x-on:click="$store.push_zeroSetup.resetConfig()">
            <x-icon name="delete"></x-icon>
            Reset Pushover Configuration
          </button>
        </div>

        <div class="po-section" style="margin-top:32px;">
          <div class="po-section-header">
            <h3>Help</h3>
          </div>
          <div class="po-section-body">
            <ol class="po-help-list">
              <li>Create or log into your <a class="po-link" href="https://pushover.net/" target="_blank" rel="noopener">Pushover</a> account.</li>
              <li>Copy your User Key from the Pushover dashboard.</li>
              <li>Create an Application/API token at <a class="po-link" href="https://pushover.net/apps/build" target="_blank" rel="noopener">pushover.net/apps/build</a>.</li>
              <li>Enter both values above and click <strong>Save Configuration</strong>.</li>
              <li>Click <strong>Test Connection</strong> to verify.</li>
              <li>Click <strong>Send Test Notification</strong> to send a real test message.</li>
            </ol>
            <p class="po-muted" style="margin-top:8px;">
              See the plugin README at
              <code>/a0/usr/plugins/push_zero/README.md</code> for more details.
            </p>
          </div>
        </div>
      </div>
    </template>
  </div>
</body>
</html>
